name: Gradle Build

on:
  push:
    branches:
      - 'master'
      - 'version/*'
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: '上传产物？'
        required: false
        default: true
        type: boolean
      custom_args:
        description: '额外Gradle参数'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: Build WorldEdit on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: ${{ !(github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/version/')) }}

    - name: Execute Gradle build
      run: ./gradlew build -s ${{ github.event.inputs.custom_args }}

    - uses: actions/upload-artifact@v6
      name: Archive Reports
      if: always()
      with:
        name: reports for ${{ matrix.os }}
        path: '**/build/reports/**'

    - uses: actions/upload-artifact@v6
      name: Archive Logs
      if: always()
      with:
        name: logs for ${{ matrix.os }}
        path: '**/*.log'

    - uses: actions/upload-artifact@v6
      name: Archive Build Artifacts
      if: ${{ github.event.inputs.upload_artifacts != 'false' }}
      with:
        name: build artifacts for ${{ matrix.os }}
        path: '**/build/libs/*.jar'
